name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set manifest version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' custom_components/mijn_interrand/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/mijn_interrand/manifest.json

      - name: Build zip
        run: |
          cd custom_components/mijn_interrand
          zip -r "$GITHUB_WORKSPACE/mijn_interrand.zip" . -x '__pycache__/*'

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" mijn_interrand.zip --clobber
